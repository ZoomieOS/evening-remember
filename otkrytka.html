<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Просто так</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&display=swap">
<style>
  :root{
    --bg:#D81B53; --cream:#FFF6EE; --wine:#8C1C3A; --rose:#C2185B;
    --red:#E8364F; --pink:#FF8FAB; --blush:#FFE4EA; --muted:#8A4A5A; --text:#4A1F2C;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg); color:var(--text);
    font-family:'Cormorant Garamond',Georgia,serif;
    min-height:100vh; min-height:100dvh; overflow-x:hidden;
    display:flex; align-items:center; justify-content:center;
    padding:24px 16px;
  }
  .decor{position:fixed;inset:0;pointer-events:none;z-index:0}
  .decor svg{position:absolute;opacity:.45}
  .dot{position:absolute;border-radius:50%;background:#FFC145;opacity:.7}

  .stage{position:relative;z-index:1;width:100%;max-width:520px}

  /* Конверт */
  .closed{display:flex;flex-direction:column;align-items:center;gap:32px;text-align:center}
  .closed h2{margin:0;font-family:'Caveat',cursive;font-weight:700;color:#fff;font-size:clamp(44px,12vw,60px);line-height:1.05}
  .closed p{margin:0;font-size:22px;font-style:italic;color:#fff}
  .envbtn{border:0;padding:0;background:transparent;cursor:pointer;border-radius:14px;width:100%;max-width:440px;
    animation:wiggle 2.4s ease-in-out infinite;transform-origin:50% 60%}
  .envbtn svg{display:block;width:100%;height:auto}
  .envbtn:focus-visible,.heartbtn:focus-visible{outline:3px solid #FFC145;outline-offset:6px}

  /* Открытка */
  .card{display:none;background:var(--cream);border-radius:26px;padding:24px clamp(20px,6vw,44px) 30px;
    flex-direction:column;align-items:center;text-align:center;animation:fadeup .7s ease-out both;
    box-shadow:0 20px 50px rgba(80,0,30,.25)}
  .is-open .closed{display:none}
  .is-open .card{display:flex}
  .bouquet{width:min(240px,62vw);height:auto;display:block}
  h1{margin:6px 0 0;font-size:clamp(46px,13vw,60px);line-height:1;font-weight:600;font-style:italic;color:var(--rose)}
  .lead{margin:14px 0 0;font-size:21px;line-height:1.4}
  .reason-box{margin-top:18px;width:100%;min-height:110px;padding:16px 20px;border-radius:18px;background:var(--blush);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
  .reason{margin:0;font-size:24px;line-height:1.3;font-weight:600;font-style:italic;color:var(--wine)}
  .reason.swap{animation:fadeup .45s ease-out both}
  .count{margin:0;font-family:system-ui,sans-serif;font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted)}
  .heartbtn{margin-top:22px;width:84px;height:84px;border:0;border-radius:50%;background:var(--red);cursor:pointer;
    display:flex;align-items:center;justify-content:center;box-shadow:0 8px 22px rgba(194,24,91,.35);
    animation:pulse 1.6s ease-in-out infinite;-webkit-tap-highlight-color:transparent}
  .hint{margin:10px 0 0;font-size:18px;font-style:italic;color:var(--muted)}
  .sign{margin:22px 0 0;font-family:'Caveat',cursive;font-size:44px;line-height:1;font-weight:700;color:var(--rose)}

  /* Летящие сердечки */
  .hearts{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:5}
  .fly{position:absolute;bottom:40px;opacity:0;animation:rise 3s cubic-bezier(.2,.7,.3,1) forwards}

  @keyframes rise{0%{transform:translateY(0) scale(.5) rotate(0);opacity:0}12%{opacity:1}100%{transform:translateY(-95vh) scale(1.15) rotate(24deg);opacity:0}}
  @keyframes pulse{0%,100%{transform:scale(1)}15%{transform:scale(1.14)}30%{transform:scale(.96)}45%{transform:scale(1.08)}}
  @keyframes wiggle{0%,100%{transform:rotate(0)}20%{transform:rotate(-2.5deg)}40%{transform:rotate(2.5deg)}60%{transform:rotate(-1.5deg)}80%{transform:rotate(1deg)}}
  @keyframes fadeup{0%{opacity:0;transform:translateY(18px)}100%{opacity:1;transform:translateY(0)}}
  @media (prefers-reduced-motion: reduce){
    .envbtn,.heartbtn{animation:none}
  }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <path id="heart" d="M12 21C12 21 3 14.5 3 8.5 3 5.5 5.5 3 8.5 3 10.2 3 11.4 3.9 12 5 12.6 3.9 13.8 3 15.5 3 18.5 3 21 5.5 21 8.5 21 14.5 12 21 12 21Z"/>
  </defs>
</svg>

<div class="decor" aria-hidden="true">
  <svg style="left:5%;top:6%" width="34" height="34" viewBox="0 0 24 24"><use href="#heart" fill="#FF8FAB"/></svg>
  <svg style="right:8%;top:13%" width="24" height="24" viewBox="0 0 24 24"><use href="#heart" fill="#FF8FAB"/></svg>
  <svg style="right:6%;bottom:9%" width="44" height="44" viewBox="0 0 24 24"><use href="#heart" fill="#FF8FAB"/></svg>
  <svg style="left:4%;bottom:7%" width="26" height="26" viewBox="0 0 24 24"><use href="#heart" fill="#FF8FAB"/></svg>
  <svg style="left:47%;top:2%" width="20" height="20" viewBox="0 0 24 24"><use href="#heart" fill="#FF8FAB"/></svg>
  <span class="dot" style="left:18%;top:17%;width:6px;height:6px"></span>
  <span class="dot" style="right:18%;top:7%;width:5px;height:5px"></span>
  <span class="dot" style="right:4%;top:47%;width:6px;height:6px"></span>
  <span class="dot" style="left:5%;top:51%;width:5px;height:5px"></span>
  <span class="dot" style="right:26%;bottom:4%;width:6px;height:6px"></span>
</div>

<main class="stage" id="stage">
  <section class="closed">
    <h2>Для самой<br>красивой</h2>
    <button class="envbtn" id="open" aria-label="Открыть открытку">
      <svg viewBox="0 0 440 300" aria-hidden="true">
        <rect x="2" y="2" width="436" height="296" rx="14" fill="#FFF4EA" stroke="#8C1C3A" stroke-width="2"/>
        <path d="M4 296 L190 150 M436 296 L250 150" stroke="#E7B9B0" stroke-width="2" fill="none"/>
        <path d="M4 6 L220 172 L436 6" fill="#FFE1D3" stroke="#8C1C3A" stroke-width="2" stroke-linejoin="round"/>
        <g transform="translate(192 140) scale(2.4)"><use href="#heart" fill="#E8364F" stroke="#8C1C3A" stroke-width="0.8"/></g>
      </svg>
    </button>
    <p>нажми на конверт</p>
  </section>

  <section class="card" aria-live="polite">
    <svg class="bouquet" viewBox="0 0 300 330" aria-hidden="true">
      <g fill="none" stroke="#2E8B57" stroke-width="2.4" stroke-linecap="round">
        <path d="M150 310 C140 240 115 190 95 132"/><path d="M150 310 C150 230 150 160 150 108"/>
        <path d="M150 310 C160 240 185 190 205 128"/><path d="M150 310 C140 250 128 215 118 186"/>
        <path d="M150 310 C162 250 175 215 186 180"/><path d="M70 160 C80 190 110 230 140 270"/>
        <path d="M232 156 C222 190 190 230 160 270"/>
      </g>
      <g fill="#7CC68D" stroke="#2E8B57" stroke-width="1.6">
        <path d="M128 228 C104 220 92 202 90 186 C108 190 124 204 128 228 Z"/>
        <path d="M172 228 C196 220 208 202 210 186 C192 190 176 204 172 228 Z"/>
        <path d="M142 262 C122 262 108 250 102 238 C120 236 136 246 142 262 Z"/>
        <path d="M158 262 C178 262 192 250 198 238 C180 236 164 246 158 262 Z"/>
      </g>
      <g transform="translate(95 118)">
        <path d="M-18 2 C-21 -25 -8 -35 0 -23 C8 -35 21 -25 18 2 C14 17 -14 17 -18 2 Z" fill="#FF5A5F" stroke="#8C1C3A" stroke-width="1.5"/>
        <path d="M0 -23 C-3 -8 -3 4 0 13" fill="none" stroke="#8C1C3A" stroke-width="1.2"/>
      </g>
      <g transform="translate(205 114)">
        <path d="M-18 2 C-21 -25 -8 -35 0 -23 C8 -35 21 -25 18 2 C14 17 -14 17 -18 2 Z" fill="#FF8FAB" stroke="#8C1C3A" stroke-width="1.5"/>
        <path d="M0 -23 C3 -8 3 4 0 13" fill="none" stroke="#8C1C3A" stroke-width="1.2"/>
      </g>
      <g transform="translate(150 84)">
        <circle r="34" fill="#E8364F" stroke="#8C1C3A" stroke-width="1.6"/>
        <path d="M0 -4 C6 -6 8 2 3 6 C-4 10 -12 2 -9 -6 C-6 -16 10 -18 16 -8 C22 4 12 18 -2 18 C-18 18 -26 2 -20 -12 C-14 -24 6 -28 20 -20" fill="none" stroke="#8C1C3A" stroke-width="1.6" stroke-linecap="round"/>
      </g>
      <g transform="translate(118 182)" stroke="#8C1C3A" stroke-width="1.2" fill="#FFFFFF">
        <ellipse cy="-12" rx="8" ry="13"/><ellipse cy="-12" rx="8" ry="13" transform="rotate(72)"/>
        <ellipse cy="-12" rx="8" ry="13" transform="rotate(144)"/><ellipse cy="-12" rx="8" ry="13" transform="rotate(216)"/>
        <ellipse cy="-12" rx="8" ry="13" transform="rotate(288)"/><circle r="6.5" fill="#FFC145"/>
      </g>
      <g transform="translate(186 176)" stroke="#8C1C3A" stroke-width="1.2" fill="#FFFFFF">
        <ellipse cy="-12" rx="8" ry="13"/><ellipse cy="-12" rx="8" ry="13" transform="rotate(72)"/>
        <ellipse cy="-12" rx="8" ry="13" transform="rotate(144)"/><ellipse cy="-12" rx="8" ry="13" transform="rotate(216)"/>
        <ellipse cy="-12" rx="8" ry="13" transform="rotate(288)"/><circle r="6.5" fill="#FFC145"/>
      </g>
      <g fill="#FFC145" stroke="#8C1C3A" stroke-width="1.1">
        <circle cx="70" cy="160" r="5"/><circle cx="61" cy="149" r="4.5"/><circle cx="77" cy="145" r="4.5"/>
        <circle cx="232" cy="156" r="5"/><circle cx="241" cy="144" r="4.5"/><circle cx="225" cy="141" r="4.5"/>
      </g>
      <g stroke="#8C1C3A" stroke-width="1.6" fill="#FF8FAB" stroke-linejoin="round">
        <path d="M150 268 C134 252 112 252 114 266 C116 280 136 276 150 268 Z"/>
        <path d="M150 268 C166 252 188 252 186 266 C184 280 164 276 150 268 Z"/>
        <path d="M146 272 L132 306 L142 300 L146 312 Z"/><path d="M154 272 L168 306 L158 300 L154 312 Z"/>
        <circle cx="150" cy="268" r="5.5" fill="#E8364F"/>
      </g>
    </svg>

    <h1>Просто так</h1>
    <p class="lead">Моё маленькое напоминание без повода: я&nbsp;восхищаюсь тобой.</p>

    <div class="reason-box">
      <p class="reason" id="reason"></p>
      <p class="count" id="count"></p>
    </div>

    <button class="heartbtn" id="next" aria-label="Ещё одна причина">
      <svg width="44" height="44" viewBox="0 0 24 24" aria-hidden="true"><use href="#heart" fill="#FFFFFF"/></svg>
    </button>
    <p class="hint">нажми на сердечко</p>

    <p class="sign">Твой Олег</p>
  </section>
</main>

<div class="hearts" id="hearts" aria-hidden="true"></div>

<script>
  var REASONS = [
    'Ты невероятно красивая — и каждый раз я замечаю это будто впервые.',
    'Я без ума от твоих глаз. Правда, в них можно утонуть.',
    'Я восхищаюсь тем, как ты смеёшься, думаешь и заботишься.',
    'Когда ты улыбаешься, весь мой день становится лучше.',
    'Твои глаза — моё любимое место на свете.',
    'Мне повезло больше всех: у меня есть ты.'
  ];
  var COLORS = ['#FF5A5F', '#FF8FAB', '#FFC145', '#E8364F', '#FFFFFF', '#FFB3C6'];
  var i = 0;
  var stage = document.getElementById('stage');
  var reasonEl = document.getElementById('reason');
  var countEl = document.getElementById('count');
  var layer = document.getElementById('hearts');
  var NS = 'http://www.w3.org/2000/svg';
  var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function showReason() {
    reasonEl.textContent = REASONS[i];
    countEl.textContent = 'причина ' + (i + 1) + ' из ' + REASONS.length;
    reasonEl.classList.remove('swap');
    void reasonEl.offsetWidth;
    reasonEl.classList.add('swap');
  }

  function burst(n) {
    if (reduced) return;
    for (var k = 0; k < n; k++) {
      var size = Math.round(18 + Math.random() * 26);
      var svg = document.createElementNS(NS, 'svg');
      svg.setAttribute('viewBox', '0 0 24 24');
      svg.setAttribute('class', 'fly');
      svg.style.left = (4 + Math.random() * 88) + '%';
      svg.style.width = size + 'px';
      svg.style.height = size + 'px';
      svg.style.animationDelay = (Math.random() * 0.6).toFixed(2) + 's';
      var use = document.createElementNS(NS, 'use');
      use.setAttribute('href', '#heart');
      use.setAttribute('fill', COLORS[k % COLORS.length]);
      use.setAttribute('stroke', '#8C1C3A');
      use.setAttribute('stroke-width', '0.6');
      svg.appendChild(use);
      layer.appendChild(svg);
      svg.addEventListener('animationend', function (e) { e.currentTarget.remove(); });
    }
  }

  document.getElementById('open').addEventListener('click', function () {
    stage.classList.add('is-open');
    showReason();
    burst(18);
    document.getElementById('next').focus({ preventScroll: true });
  });

  document.getElementById('next').addEventListener('click', function () {
    i = (i + 1) % REASONS.length;
    showReason();
    burst(10);
  });
</script>
</body>
</html>
